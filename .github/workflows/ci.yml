name: CI

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Swift environment
        run: swift --version

      - name: Build project
        run: swift build

      - name: Execute test suite
        run: swift run KansoCoreTests

      - name: Build and package macOS .app bundle
        run: ./scripts/build-app.sh debug
